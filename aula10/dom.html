<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
    <style>
        
        div#area{
        font: normal 20pt Arial;
        background-color: rgb(115, 39, 145);
        color: hsl(0, 0%, 100%);
        width: 200px;
        height: 200px;
        line-height: 200px;
        text-align: center;
        }
    </style>
</head>
<body>

    <div id = "area">
        Interaja...
    </div>

    <script>

        /*Podemos criar os comandos no html ou no script para chamar eventos
        HTML -> <div id = "area" onclick="clicar()" onmouseenter="entrar()" onmouseout="sair()">

        Lista no script */
        var a = window.document.getElementById('area')
        a.addEventListener('click', clicar)
        a.addEventListener('mouseenter', entrar)
        a.addEventListener('mouseout', sair)


        function clicar(){
            
            a.innerText = 'Clicou!'
            a.style.background = 'green'
        }

        function entrar(){
            
            a.innerText = 'Entrou!'

        }

        function sair(){
            
            a.innerText = 'Saiu!!'
            a.style.background = 'purple'

        }


    </script>
    
</body>
</html>
